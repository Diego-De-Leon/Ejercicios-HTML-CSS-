<!DOCTYPE html> <!-- DJDLA - HTML y CSS -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket</title>
    <link rel="stylesheet" href="estilo.css"> <!-- Enlaza HTML y CSS -->
</head>
<body>
    <div class="ticket">
        <div class="top">
            <h2>Cinema</h2>
            <div class="movie-title">CS Film</div>
        </div>
        <div class="bottom">
            <div class="info">
                <div>DATE</div>
                <span>SEP 38</span>
            </div>
            <div class="info" style="text-align: center;">
                <div>TIME</div>
                <span>20:00</span>
            </div>
            <div class="info" style="text-align: right;">
                <div>SEAT</div>
                <span>A12</span>
            </div>
        </div>
    </div>
</body>
</html>
