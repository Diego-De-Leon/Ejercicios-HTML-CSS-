<!DOCTYPE html> <!-- DJDLA - HTML y CSS -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Login</title>
    <link rel="stylesheet" href="estilo.css"> <!-- Enlaza HTML y CSS -->
</head>

<body>
    <div class="glass-card"> <!-- Contenedor principal del login -->
        <h2>Welcome</h2> <!-- Titulo de bienvenida -->
        <form> <!-- Inicio del formulario -->
            <!-- Campo de correo electronico -->
            <input type="text" placeholder="Email" required>
            <!-- Campo de contraseña -->
            <input type="password" placeholder="Password" required>
            <!-- Botón de envio -->
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>

</html>
